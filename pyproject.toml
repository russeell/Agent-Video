[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-video"
version = "0.1.0"
description = "Let your agent watch videos: acquire timestamped evidence from videos."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["truststore>=0.10", "websocket-client>=1.8"]

[project.scripts]
agent-video = "scripts.watch:main"

[project.urls]
Repository = "https://github.com/russeell/Agent-Video"

[project.optional-dependencies]
# faster-whisper 1.2.1 still passes metadata_errors, removed by PyAV 19.
asr = ["faster-whisper>=1.2,<2", "av<19"]

[tool.setuptools]
packages = ["scripts", "scripts.platforms"]

[tool.setuptools.data-files]
"share/agent-video" = ["README.md", "README.zh-CN.md", "INSTALL.md", "UPDATE.md", "SEARCH.md", "SKILL.md", "LICENSE"]
