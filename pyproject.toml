[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-video"
version = "0.1.0"
description = "Let your agent watch videos: acquire timestamped evidence from videos."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["truststore>=0.10", "cryptography>=42.0"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.2,<2"]

[tool.setuptools]
packages = ["scripts", "scripts.platforms"]
